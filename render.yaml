services:
  - type: web
    name: chama12-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build && npm run db:migrate && npm run db:seed
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: chama12-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: uploads
    # Sem disco persistente no plano free — uploads em `uploads/` somem a cada
    # redeploy/restart. Aceitável pra testar agora; trocar STORAGE_PROVIDER
    # pra um provider de object storage (ex: Cloudflare R2) antes de produção.

databases:
  - name: chama12-db
    plan: free
    databaseName: chama12
    user: chama12
