services:
  - type: web
    name: chama12-api
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build && npm run db:migrate
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: chama12-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: uploads
    disk:
      name: chama12-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

databases:
  - name: chama12-db
    plan: free
    databaseName: chama12
    user: chama12
